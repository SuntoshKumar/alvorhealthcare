name: Validate showcase content

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alvorhealthcare

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: alvorhealthcare/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate content and code
        run: npm run check

      - name: Build production site
        run: npm run build
